<mat-dialog-content>
  <p class="font-bold mt-0 mb-4 text-xl">Create an account now!</p>

  <p class="w-full text-gray-500 font-bold mt-0 mb-1">
    Sign up with your email
  </p>

  <form [formGroup]="form" class="flex flex-col items-center">
    <mat-form-field appearance="outline" class="w-full py-2">
      <mat-label>Email</mat-label>
      <input
        matInput
        formControlName="email"
        placeholder="Your awesome email"
        cdkFocusInitial
      />
      <mat-icon matIconPrefix>mail</mat-icon>
    </mat-form-field>

    <button
      mat-raised-button
      class="my-2"
      type="button"
      [disabled]="!validatedForm"
      [mat-dialog-close]="email?.value"
    >
      Sign Up
    </button>
  </form>

  <div class="flex justify-center w-full">
    <button mat-button class="my-2" type="button" [mat-dialog-close]="null">
      I already have an account
    </button>
  </div>
</mat-dialog-content>
